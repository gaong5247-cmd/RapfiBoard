name: RapfiBoard Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Create release keystore
        run: |
          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/local-release.jks \
            -storepass rapfiboard-local \
            -keypass rapfiboard-local \
            -alias rapfiboard \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=RapfiBoard, OU=CI, O=RapfiBoard, L=Seoul, ST=Seoul, C=KR"

      - name: Build APK
        run: python3 scripts/build_apk.py --release all --run-tests

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: rapfiboard-android-release
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
